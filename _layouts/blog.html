<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f9f7">
  <title>{{ page.title | escape }} · 杨瑞卿</title>
  <meta name="description" content="{{ page.description | default: '杨瑞卿的技术笔记：记录开发、学习与实践。' | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | escape }} · 杨瑞卿">
  <meta property="og:description" content="{{ page.description | default: '开发、学习与实践中的技术笔记。' | escape }}">
  <meta property="og:type" content="{% if page.post_id %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/profile/portrait.jpg' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/profile/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="alternate" href="{{ '/atom.xml' | relative_url }}" title="杨瑞卿 · 技术笔记" type="application/atom+xml">
  <link rel="stylesheet" href="{{ '/assets/profile/fonts.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/blog/blog.css' | relative_url }}">
</head>
<body class="blog-site{% if page.post_id %} reading-page{% endif %}">
  <a class="skip-link" href="#main-content">跳至正文</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="杨瑞卿个人主页">ry<span>.</span></a>
      <a class="header-section" href="{{ '/blog/' | relative_url }}">技术笔记</a>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="primary-navigation">导航 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <nav class="primary-nav" id="primary-navigation" aria-label="主导航">
        <a href="{{ '/' | relative_url }}">个人主页</a>
        <a href="{{ '/' | relative_url }}#projects">项目</a>
        <a href="{{ '/cv/' | relative_url }}">简历</a>
        <a href="{{ '/blog/' | relative_url }}"{% unless page.view == 'archive' %} aria-current="page"{% endunless %}>博客</a>
        <a href="{{ '/archives/' | relative_url }}"{% if page.view == 'archive' %} aria-current="page"{% endif %}>归档</a>
      </nav>
    </div>
  </header>
  <main id="main-content" class="blog-shell">{{ content }}</main>
  <footer class="site-footer"><div><span>© {{ 'now' | date: '%Y' }} Ruiqing Yang <span class="footer-separator">/</span> 杨瑞卿</span><span><a href="{{ '/atom.xml' | relative_url }}">RSS 订阅</a><a href="https://github.com/1193700079/1193700079.github.io" target="_blank" rel="noopener noreferrer">网站源码 ↗</a></span></div></footer>
  <script src="{{ '/assets/blog/blog.js' | relative_url }}" defer></script>
  <script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-mml-chtml.js"></script>
</body>
</html>
